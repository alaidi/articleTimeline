# Branch pushes only: a version tag is already tested as the commit on its branch.
on:
  push:
    branches: ['**']
  pull_request:
name: articleTimeline
jobs:
  articleTimeline:
    runs-on: ubuntu-24.04  # ubuntu-26.04 dropped apt-key + mysql-server-8.0 that pkp-github-actions@v1 needs
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: ojs
            php-version: 8.3
            database: mysql
          - application: ojs
            php-version: 8.2
            database: mysql
          - application: ojs
            php-version: 8.3
            database: pgsql
          - application: ojs
            php-version: 8.2
            database: pgsql
    name: articleTimeline
    steps:
      - uses: pkp/pkp-github-actions@v1
        with:
         node_version: 20
         branch: 'stable-3_5_0'
         repository: pkp
         plugin: true
         dataset_inject: true
